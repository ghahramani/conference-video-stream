[package]
name = "streaming-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = { version = "0.8.8", features = ["ws"] }

tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["fs"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
futures = "0.3"
dashmap = "6.1.0"
base64 = "0.22"

async-stream = "0.3"