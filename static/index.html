<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactive Video Meet</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div id="login-overlay">
    <div class="login-box">
        <h2>Join Room</h2>
        <input type="text" id="usernameInput" placeholder="Your Name" value="Person">
        <input type="text" id="streamInput" placeholder="Room Name (e.g., room1)" value="room1">

        <div class="buttons">
            <button onclick="joinAsWatcher()">Join as Watcher</button>
            <button onclick="joinAsPresenter()" class="primary">Join as Presenter</button>
        </div>
    </div>
</div>

<div id="video-grid" class="grid-0"></div>

<script src="app.js"></script>
</body>
</html>
